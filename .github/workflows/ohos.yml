# OpenHarmony 移植的宿主侧 CI。
#
# **覆盖范围是刻意划死的**：只覆盖宿主侧（重建工具链 + 移植承重的那些包的宿主
# 测试 + 交叉编译冒烟）。设备侧**不覆盖** —— 那要模拟器 + hdc，放 GitHub runner
# 上不现实，仍靠手工（`misc/openharmony/runtests.sh`，见 docs/ohos-full-test-plan.md）。
#
# 所以这个 workflow 保证的是「宿主编译器没坏」，**不是**「产物能跑」。
# 这三层结论互不背书，是本项目反复吃过的教训（见 docs/ohos-release-roadmap.md ⑥）。

name: ohos

on:
  push:
    branches: ['main', 'ohos-*']
  pull_request:
    branches: ['main', 'ohos-*']
  schedule:
    # 每天一遍全量 A 层。整点会挤，挑 :23。
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  # src/go.mod 写 go 1.27 —— GOTOOLCHAIN=auto 下 bootstrap 会去下官方 go1.27，
  # 而官方工具链编不出 GOOS=openharmony，结局是一句难懂的构建失败。
  GOTOOLCHAIN: local
  GOPROXY: off

jobs:
  host:
    name: 宿主侧 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # 两个宿主都实测过：ubuntu = linux/amd64（在 172.16.1.238 上验的），
        # macos-14 = darwin/arm64（发布 tarball 的那个宿主）。
        # 加宿主不是为了覆盖率好看 —— delta 里有宿主相关的分支（cmd/dist 的自举、
        # misc 包装、AR 的形态），单宿主看不出来。
        #
        # 两个都**写死版本**，不用 -latest：ubuntu-latest 从 2026-10-19 起迁到
        # Ubuntu 26，而 A 层基线（377 ok / 0 FAIL）是在 24.04 上量的 —— 漂了之后
        # 红的是基线不是代码，且没有任何东西提醒你宿主换了。写死版本让这次切换
        # 变成一次**显式的**升级动作（改这一行 + 重量基线）。macos-14 本来就是
        # 写死的，两格对称。
        os: [ubuntu-24.04, macos-14]
    steps:
      - uses: actions/checkout@v7

      # bootstrap 必须 >= go1.24.6。别降到 1.24 —— Debian 那包是 1.24.4，差一点点。
      # 刻意关掉 setup-go 的缓存：这里没有任何模块依赖，缓存只增加不确定性。
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache: false

      # 基线的可溯源性：把宿主的实际身份打进日志。**写死版本号 ≠ 镜像不变** ——
      # 固定标签的 runner 镜像本身也按月更新（编译器、内核、预装工具）。这一步是
      # 唯一能事后回答「当时是哪台机器」的东西，代价半秒。
      # 必须在 setup-go **之后**：`go version` 打的得是真正当 bootstrap 的那个。
      - name: 宿主身份
        run: |
          (cat /etc/os-release 2>/dev/null || sw_vers) | head -4
          uname -a
          (cc --version 2>&1 || true) | head -1
          go version

      # 不要给 GOCACHE 加 actions/cache。陈旧缓存会让 reloc 枚举编号漂移，链接期报
      # `unknown reloc to ...: 105 (RelocType(105))` —— 本项目反复踩过的坑。每次
      # 从零编译的代价换的是确定性。
      - name: 重建工具链
        run: |
          cd src
          GOROOT_BOOTSTRAP="$(go env GOROOT)" ./make.bash

      # 断言「带 fork 标记」而不是具体版本号 —— 否则每次合并上游都要改 CI。
      - name: 版本串带 fork 标记
        run: |
          cd src
          v=$(../bin/go version)
          echo "$v"
          case "$v" in
          *-ohos*) ;;
          *)
            echo "::error::版本串里没有 -ohos 标记：$v"
            exit 1
            ;;
          esac

      # go.env 就是 GOROOT 根的那个文件（bin/go 按自身位置推 GOROOT），所以这里查的
      # 就是发出去的值。上游写的是 GOTOOLCHAIN=auto，留着的话用户依赖一旦要求更高
      # 版本，go 会去下官方工具链，而官方工具链编不出 GOOS=openharmony。
      #
      # 为什么非查文件不可：本 workflow 顶上的 env 已经把 GOTOOLCHAIN 钉成 local，
      # **运行期看不出差别 —— 这条 delta 丢了 CI 也不会红**，除非直接查文件。
      - name: go.env 的 GOTOOLCHAIN 必须是 local
        run: |
          set -eu
          grep -qx 'GOTOOLCHAIN=local' go.env || {
            echo "::error::go.env 里的 GOTOOLCHAIN 不是 local：$(grep '^GOTOOLCHAIN' go.env || echo 缺失)"
            exit 1
          }

      # cmd/dist 那份 TestMustLinkExternal 逐格比对 MustLinkExternal 的两处副本
      # （internal/platform/supported.go 与 cmd/dist/build.go）。漏一处就红 —— 这是
      # amd64 强制外链那条 delta 唯一的自动防线。
      - name: 宿主测试（移植承重的那些包）
        run: |
          cd src
          ../bin/go test -count=1 \
            ./cmd/dist \
            ./internal/platform \
            ./internal/testenv \
            ./cmd/internal/objabi \
            ./cmd/internal/obj/arm64 \
            ./cmd/internal/obj/x86 \
            ./cmd/link/internal/ld \
            ./cmd/go/internal/work \
            ./cmd/go/internal/load

      # misc/ 的测试没有别的自动入口（dist 里注册的是 misc:execwrapper，就是这一条）。
      - name: misc 包装的单元测试
        run: |
          cd misc
          ../bin/go test -count=1 ./go_openharmony_exec

      - name: 交叉编译冒烟
        run: |
          set -eu
          GO="$GITHUB_WORKSPACE/bin/go"
          rm -rf /tmp/smoke && mkdir -p /tmp/smoke && cd /tmp/smoke
          cat > main.go <<'EOF'
          package main

          import (
          	"fmt"
          	"net"
          	"os"
          )

          // 用 net.SplitHostPort 是为了逼出 g 寄存器重载 —— 这正是 amd64 上会发
          // R_AMD64_TLS_GD 的那处，也是这条冒烟要守的东西。
          func main() {
          	host, port, err := net.SplitHostPort("127.0.0.1:5138")
          	if err != nil {
          		fmt.Fprintln(os.Stderr, err)
          		os.Exit(1)
          	}
          	fmt.Println(host, port)
          }
          EOF
          "$GO" mod init smoke

          # arm64：纯 Go 走内部链接，不需要 SDK，所以这条在 runner 上能真跑。
          env GOOS=openharmony GOARCH=arm64 CGO_ENABLED=0 \
            "$GO" build -o app-arm64 .
          test -s app-arm64

          # amd64：必须**失败**，且必须是那句可读的报错。
          # 失败才是正确行为 —— amd64 每次构建都强制外部链接（那条 delta 让
          # `cannot handle R_AMD64_TLS_GD ... when linking internally` 这句 Fatalf
          # 变成一句指方向的提示）。它若成功，说明 delta 丢了。
          if out=$(env GOOS=openharmony GOARCH=amd64 CGO_ENABLED=0 \
                     "$GO" build -o app-amd64 . 2>&1); then
            echo "::error::amd64 纯 Go 构建居然成功了 —— MustLinkExternal 那条 delta 可能丢了"
            exit 1
          fi
          case "$out" in
          *"requires external (cgo) linking"*)
            echo "amd64 按预期拒绝：$out"
            ;;
          *)
            echo "::error::amd64 的报错不是预期的那句：$out"
            exit 1
            ;;
          esac

      # 打包自检：**验的是「交出去的那个文件」，不是「你刚编出来的那棵树」**。
      #
      # 两条只有在这一步才可能红的缺陷：
      #   1. release 构建标志没生效（`cmd/dist` 的 isRelease 闸门，见 guide §6.8）。
      #      症状是 bin/ 里嵌着构建树的绝对路径，而 make.bash 退出码是 0 ——
      #      跑 `go version` 完全看不出来。
      #   2. 包里的树**自己编不出东西**（例如 pkg/tool 没打进去）。所以这里一定
      #      要从**解出来的那棵树**编一次，而不是复用上面已经编好的工作区。
      #
      # `bin/` 是**逐个文件**查的，不是只查 bin/go（2026-09-23 改）：那天实测两棵树
      # bin/go 逐字节相同，而 bin/go_openharmony_arm64_exec 一棵带构建机绝对路径、
      # 一棵不带 —— 只查 bin/go 的版本把缺陷放过去了，一路发进 beta2 的 tar 包
      # （已知问题 7c）。**但这仍守不住包装**：普通 make.bash 的 goos == gohostos，
      # `wrapperPathFor` 返回空，CI 这棵树里根本没有 _exec 包装，所以这里查不到它。
      # 包装的防线在 guide §6.7（手装时带 -trimpath + 打 tarball 前手工查整棵 bin/）。
      #
      # 不验成员名（`--transform`）：`bin/go` 按自身位置推 GOROOT，目录叫什么都不影响。
      # 顺带避开 BSD tar 没有 `--transform` 这件事（macos-14 那一格）。
      - name: 打包自检
        run: |
          set -eu
          T="$RUNNER_TEMP/selfcheck.tar.gz"
          E="$RUNNER_TEMP/selfcheck"
          cd "$GITHUB_WORKSPACE"
          tar czf "$T" \
            --exclude='./.git' --exclude='./.claude' --exclude='./CLAUDE.md' \
            --exclude='./ohos-test-results*' --exclude='.DS_Store' \
            --exclude='./misc/openharmony/loopbackhap/.hvigor' \
            --exclude='./misc/openharmony/loopbackhap/entry/build' \
            --exclude='./misc/openharmony/loopbackhap/local.properties' \
            .
          rm -rf "$E" && mkdir -p "$E" && tar xzf "$T" -C "$E"

          v=$("$E/bin/go" version)
          echo "$v"
          case "$v" in
          *-ohos*) ;;
          *)
            echo "::error::包里的 go version 没有 -ohos 标记：$v"
            exit 1
            ;;
          esac

          # 查**整棵** bin/，不是只查 bin/go。2026-09-23 实测：两棵树 bin/go 的 sha256 相同
          # （9cfddd97...，release 标志都生效了），而 bin/go_openharmony_arm64_exec 一棵带
          # 构建机绝对路径、一棵不带 —— 只查 bin/go 的版本把这棵树放过去了，缺陷一路发到了
          # beta2 的 tar 包里（事后在发布的那份 darwin 资产上核实过：两个包装各 366 处
          # /Users/xiphis/go1.27.1-ohos/...，而 bin/go 是 0 处）。dirty=1 是让循环报出全部
          # 命中项再失败，别第一个就退。
          #
          # 两条判据是故意都留的：`$GITHUB_WORKSPACE` 那条对**本树**更宽（任何形态的路径都抓），
          # 但只在「CI 打的就是它自己在 $GITHUB_WORKSPACE 里编的树」时成立 —— 哪天打包改成
          # 打一棵别处编的树，它会**静默失效**。`^/...\.go$` 那条与路径无关，兜住那种情况。
          # 别把 `-F "$PWD"` 那类写法当判据：解包到别的路径后它恒为 0（guide §6.7 有取证）。
          dirty=0
          for f in "$E"/bin/*; do
            [ -f "$f" ] || continue
            b="${f#"$E"/}"
            # `-n` 的守卫不是形式主义：变量空时 `grep -qF ""` **匹配任何文件**，
            # 于是这个 job 假红、而且红得毫无线索。这类「检查本身会说谎」正是本节的主题。
            if [ -n "$GITHUB_WORKSPACE" ] && strings "$f" | grep -qF "$GITHUB_WORKSPACE"; then
              echo "::error::包里的 $b 带着构建树的绝对路径 —— release 构建标志没生效（guide §6.8）"
              dirty=1
            fi
            n=$(strings "$f" | grep -cE '^/[^ ]*\.go$' || true)
            if [ "$n" != 0 ]; then
              echo "::error::包里的 $b 有 $n 条绝对路径形态的 .go 串 —— 同样说明 release 标志没生效"
              dirty=1
            fi
          done
          [ "$dirty" = 0 ] || exit 1
          echo "bin/ 下没有构建树路径（bin/go 与手工装的 _exec 包装都在内）"

          mkdir -p "$E/work" && cd "$E/work"
          printf 'package main\nfunc main(){}\n' > main.go
          env PATH="$E/bin:$PATH" GOCACHE="$E/work/.cache" \
            GOOS=openharmony GOARCH=arm64 CGO_ENABLED=0 \
            "$E/bin/go" build -o app main.go
          test -s app
          echo "解出来的树能编出 arm64 产物：$(ls -l app | awk '{print $5}') 字节"

  # 每次都跑太重（runner 上 ~30 min），但它是唯一能证明「基线没坏」的一层 ——
  # go1.26.5 那代的静默 FIPS 缺陷正是在全绿的全量轮里躲过去的，不能省。
  # 所以放夜里，不参与 PR 门禁；门禁由上面的 host job 承担。
  all-bash:
    name: A 层全量 ./all.bash
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache: false
      - name: ./all.bash
        run: |
          cd src
          GOROOT_BOOTSTRAP="$(go env GOROOT)" ./all.bash
